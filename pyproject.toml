[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ellmos-bundles"
version = "1.0.0"
description = "The recipe layer of the ellmos ecosystem: bundle manifests, catalogues, and composition knowledge"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
keywords = [
    "ellmos",
    "bundles",
    "manifests",
    "recipes",
    "composition",
    "ai-agents",
    "open-ocean",
    "architecture",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-timeout>=2.2.0",
]
dev = [
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/bundles"
Repository = "https://github.com/ellmos-ai/bundles.git"
Issues = "https://github.com/ellmos-ai/bundles/issues"
Changelog = "https://github.com/ellmos-ai/bundles/blob/main/CHANGELOG.md"
Organization = "https://github.com/ellmos-ai"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -v"

[tool.ruff]
target-version = "py310"
line-length = 120
