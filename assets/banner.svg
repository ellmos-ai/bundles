<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      
      .title {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        letter-spacing: -1.5px;
      }
      .subtitle {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        letter-spacing: -0.2px;
      }
      .badge-text {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .pill-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 11.5px;
        letter-spacing: 0.5px;
      }
      .mono-code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
      }
    </style>
    
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08071a"/>
      <stop offset="50%" stop-color="#140f38"/>
      <stop offset="100%" stop-color="#060514"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="glow-purple" cx="300" cy="170" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#08071a" stop-opacity="0"/>
    </radialGradient>
    
  </defs>
  
  
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.2"/>
    <circle cx="300" cy="170" r="260" fill="url(#glow-purple)"/>
    
    <!-- Modular Hexagonal Nodes & Recipe Matrix -->
    <g transform="translate(160, 60)">
      <!-- Connecting lines -->
      <line x1="120" y1="110" x2="60" y2="60" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
      <line x1="120" y1="110" x2="180" y2="60" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
      <line x1="120" y1="110" x2="60" y2="160" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
      <line x1="120" y1="110" x2="180" y2="160" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
      
      <!-- Center Bundle Hub -->
      <rect x="85" y="75" width="70" height="70" rx="18" fill="#3b0764" stroke="#e879f9" stroke-width="2.5"/>
      <circle cx="120" cy="110" r="16" fill="#a855f7" opacity="0.4"/>
      <circle cx="120" cy="110" r="8" fill="#ffffff"/>
      
      <!-- Surrounding Node Chips -->
      <rect x="30" y="35" width="55" height="45" rx="10" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="57" y="62" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">MCP</text>
      
      <rect x="155" y="35" width="55" height="45" rx="10" fill="#1e1b4b" stroke="#c084fc" stroke-width="1.5"/>
      <text x="182" y="62" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#c084fc">SKILL</text>
      
      <rect x="30" y="140" width="55" height="45" rx="10" fill="#1e1b4b" stroke="#c084fc" stroke-width="1.5"/>
      <text x="57" y="167" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#c084fc">ROLE</text>
      
      <rect x="155" y="140" width="55" height="45" rx="10" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="182" y="167" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">CFG</text>
    </g>
    
  
    <g transform="translate(480, 0)">
      <g transform="translate(0, 58)">
        <rect width="180" height="26" rx="6" fill="#3b0764" stroke="#c084fc" stroke-width="1"/>
        <text x="90" y="17" text-anchor="middle" class="badge-text" fill="#f0abfc">ELLMOS-AI RECIPES</text>
      </g>
      
      <text x="0" y="142" class="title" font-size="58" fill="url(#title-grad)">bundles</text>
      
      <text x="0" y="184" class="subtitle" font-size="20" fill="#f5d0fe">The Recipe &amp; Composition Layer of the ellmos Ecosystem</text>
      <text x="0" y="210" class="subtitle" font-size="14" fill="#cbd5e1" opacity="0.8">Bundle manifests, tool catalogues, and declarative agent composition knowledge.</text>
      
      <g transform="translate(0, 246)">
        <g transform="translate(0, 0)">
          <rect width="145" height="32" rx="8" fill="#2e1065" stroke="#c084fc" stroke-width="1.5"/>
          <text x="72" y="20" text-anchor="middle" class="pill-text" fill="#f0abfc">📦 Recipe Layer</text>
        </g>
        <g transform="translate(157, 0)">
          <rect width="145" height="32" rx="8" fill="#2e1065" stroke="#c084fc" stroke-width="1.5"/>
          <text x="72" y="20" text-anchor="middle" class="pill-text" fill="#f0abfc">⚡ Manifest Catalogs</text>
        </g>
        <g transform="translate(314, 0)">
          <rect width="145" height="32" rx="8" fill="#2e1065" stroke="#c084fc" stroke-width="1.5"/>
          <text x="72" y="20" text-anchor="middle" class="pill-text" fill="#f0abfc">🧩 Tool Bundles</text>
        </g>
      </g>
    </g>
    
</svg>