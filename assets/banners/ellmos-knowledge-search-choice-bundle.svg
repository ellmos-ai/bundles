  <defs>
    <!-- Sky and water meet at the waterline in the same colour, so the horizon is
         drawn by the hairline below and never by a seam between two rectangles. -->
    <linearGradient id="bnr-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14303f"/>
      <stop offset="1" stop-color="#24505f"/>
    </linearGradient>
    <linearGradient id="bnr-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24505f"/>
      <stop offset="1" stop-color="#0a1a24"/>
    </linearGradient>
    <radialGradient id="bnr-lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d98247" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#d98247" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#d98247" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bnr-veil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a1a24" stop-opacity="0.97"/>
      <stop offset="0.55" stop-color="#0a1a24" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#0a1a24" stop-opacity="0"/>
    </linearGradient>
  </defs>

