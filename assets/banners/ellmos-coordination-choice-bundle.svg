  <rect width="760" height="300" fill="url(#bnr-veil)"/>

  <g transform="translate(72 0)">
    <rect x="0" y="88" width="207.5" height="26" rx="13" fill="none" stroke="#5fe3c0" stroke-opacity="0.5"/>
    <text x="15" y="105.5" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" letter-spacing="1.7" fill="#5fe3c0" fill-opacity="0.92">CONTROL · KLARWASSER</text>
    <text x="-2" y="171" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="36" font-weight="600" letter-spacing="-0.6" fill="#e8fbf5">Coordination Choice Bundle</text>
    <text x="0" y="201" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="0.5" fill="#86b8ad">ellmos-coordination-choice-bundle</text>
