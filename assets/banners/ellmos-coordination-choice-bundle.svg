    <g stroke="#1f9b86" stroke-linecap="round" stroke-opacity="0.3">
      <path d="M 632 288 L 690 280.2" stroke-width="1.5"/>
      <path d="M 712 277 L 764 270" stroke-width="1.5"/>
      <path d="M 786 267 L 832 260.8" stroke-width="1.5"/>
      <path d="M 854 258 L 894 252.6" stroke-width="1.5"/>
      <path d="M 916 250 L 950 245.4" stroke-width="1.5"/>
      <path d="M 972 243 L 1000 239.2" stroke-width="1.5"/>
      <path d="M 1022 237 L 1044 234" stroke-width="1.5"/>
      <path d="M 1066 232 L 1082 229.8" stroke-width="1.5"/>
