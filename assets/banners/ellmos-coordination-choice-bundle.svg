<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Coordination Choice Bundle — Klarwasser (control pillar)">
  <title>Coordination Choice Bundle — Klarwasser (control pillar)</title>
  <defs>
    <!-- Sky and water meet at the waterline in the same colour, so the horizon is
         drawn by the hairline below and never by a seam between two rectangles. -->
    <linearGradient id="bnr-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a3a35"/>
      <stop offset="1" stop-color="#12655c"/>
    </linearGradient>
    <linearGradient id="bnr-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12655c"/>
      <stop offset="1" stop-color="#04211f"/>
    </linearGradient>
    <radialGradient id="bnr-lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5fe3c0" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#5fe3c0" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#5fe3c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bnr-veil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#04211f" stop-opacity="0.97"/>
      <stop offset="0.55" stop-color="#04211f" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#04211f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="208" fill="url(#bnr-sky)"/>
  <rect y="208" width="1200" height="92" fill="url(#bnr-water)"/>
  <rect x="520" y="208" width="680" height="1" fill="#1f9b86" opacity="0.5"/>

  <g id="scene-helm">
    <g fill="#02160f" opacity="0.9">
      <rect x="838" y="186" width="188" height="15"/>
      <rect x="858" y="201" width="9" height="58"/>
      <rect x="906" y="201" width="9" height="58"/>
      <rect x="954" y="201" width="9" height="58"/>
      <rect x="1002" y="201" width="9" height="58"/>
      <rect x="923" y="150" width="14" height="38"/>
    </g>
    <rect x="838" y="186" width="188" height="1" fill="#1f9b86" opacity="0.3"/>
    <g fill="#02160f" opacity="0.72">
      <rect x="838" y="163" width="74" height="3"/>
      <rect x="992" y="163" width="34" height="3"/>
      <rect x="840" y="166" width="3" height="20"/>
      <rect x="872" y="166" width="3" height="20"/>
      <rect x="906" y="166" width="3" height="20"/>
      <rect x="994" y="166" width="3" height="20"/>
      <rect x="1022" y="166" width="3" height="20"/>
    </g>
    <g stroke="#02160f" stroke-linecap="round" fill="none" opacity="0.92">
      <circle cx="930" cy="116" r="51" stroke-width="6"/>
      <path d="M 937.1 108.9 L 981.6 64.4" stroke-width="5.4"/>
      <path d="M 940 116 L 1003 116" stroke-width="5.4"/>
      <path d="M 937.1 123.1 L 981.6 167.6" stroke-width="5.4"/>
      <path d="M 930 126 L 930 189" stroke-width="5.4"/>
      <path d="M 922.9 123.1 L 878.4 167.6" stroke-width="5.4"/>
      <path d="M 920 116 L 857 116" stroke-width="5.4"/>
      <path d="M 922.9 108.9 L 878.4 64.4" stroke-width="5.4"/>
    </g>
    <circle cx="930" cy="116" r="10" fill="#02160f" opacity="0.92"/>
    <path d="M 930 106 L 930 43" fill="none" stroke="#5fe3c0" stroke-width="5.4" stroke-linecap="round" stroke-opacity="0.92"/>
