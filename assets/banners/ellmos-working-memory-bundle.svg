<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Working Memory Bundle — Tiefenwasser (memory pillar)">
  <title>Working Memory Bundle — Tiefenwasser (memory pillar)</title>
  <defs>
    <!-- Sky and water meet at the waterline in the same colour, so the horizon is
         drawn by the hairline below and never by a seam between two rectangles. -->
    <linearGradient id="bnr-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3050"/>
      <stop offset="1" stop-color="#17567f"/>
    </linearGradient>
    <linearGradient id="bnr-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17567f"/>
      <stop offset="1" stop-color="#071c2e"/>
    </linearGradient>
    <radialGradient id="bnr-lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fd4e8" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#7fd4e8" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#7fd4e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bnr-veil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#071c2e" stop-opacity="0.97"/>
      <stop offset="0.55" stop-color="#071c2e" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#071c2e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="208" fill="url(#bnr-sky)"/>
  <rect y="208" width="1200" height="92" fill="url(#bnr-water)"/>
  <rect x="520" y="208" width="680" height="1" fill="#3d8fb8" opacity="0.5"/>

  <g id="scene-wake">
    <g stroke="#3d8fb8" stroke-linecap="round" stroke-opacity="0.15">
      <path d="M 1046 232 h 44" stroke-width="1.4"/>
      <path d="M 1124 256 h 32" stroke-width="1.4"/>
      <path d="M 972 286 h 46" stroke-width="1.4"/>
      <path d="M 664 236 h 34" stroke-width="1.4"/>
      <path d="M 1152 220 h 24" stroke-width="1.4"/>
      <path d="M 744 292 h 40" stroke-width="1.4"/>
    </g>
    <g stroke="#3d8fb8" stroke-linecap="round">
      <path d="M 912 219 h 40" stroke-width="1.4" stroke-opacity="0.3"/>
      <path d="M 856 228 h 46" stroke-width="1.4" stroke-opacity="0.26"/>
      <path d="M 798 232 h 40" stroke-width="1.4" stroke-opacity="0.2"/>
      <path d="M 742 240 h 44" stroke-width="1.4" stroke-opacity="0.16"/>
      <path d="M 690 246 h 36" stroke-width="1.4" stroke-opacity="0.12"/>
      <path d="M 866 246 h 30" stroke-width="1.4" stroke-opacity="0.14"/>
      <path d="M 786 256 h 34" stroke-width="1.4" stroke-opacity="0.1"/>
      <path d="M 652 258 h 26" stroke-width="1.4" stroke-opacity="0.09"/>
    </g>
    <g fill="#03121f" opacity="0.5">
      <path d="M 856 199 L 861 208 L 851 208 Z"/><rect x="854.5" y="193" width="3" height="7"/>
      <path d="M 706 201 L 710 208 L 702 208 Z"/><rect x="704.5" y="196" width="3" height="6"/>
    </g>
    <g fill="#03121f" opacity="0.92">
      <path d="M 974 197 L 1108 190 L 1098 209 L 986 210 Z"/>
      <rect x="1036" y="128" width="4" height="70"/>
      <path d="M 1033 133 L 1033 192 L 995 192 Z"/>
      <path d="M 1043 143 L 1043 192 L 1084 189 Z"/>
      <rect x="1000" y="186" width="26" height="12" rx="2"/>
    </g>
    <g fill="none" stroke="#7fd4e8" stroke-linecap="round">
      <path d="M 976 211 Q 916 212 856 214" stroke-width="2.2" stroke-opacity="0.88"/>
      <path d="M 856 214 Q 776 216 696 219" stroke-width="1.8" stroke-opacity="0.5"/>
      <path d="M 696 219 Q 658 220 620 222" stroke-width="1.5" stroke-opacity="0.24"/>
      <path d="M 978 213 Q 918 222 858 232" stroke-width="2" stroke-opacity="0.66"/>
      <path d="M 858 232 Q 778 245 698 259" stroke-width="1.7" stroke-opacity="0.36"/>
      <path d="M 698 259 Q 659 266 620 273" stroke-width="1.4" stroke-opacity="0.16"/>
      <path d="M 966 210 q 6 4 12 4" stroke-width="2.4" stroke-opacity="0.9"/>
    </g>
    <g fill="none" stroke="#7fd4e8" stroke-linecap="round">
      <path d="M 908 213 Q 895 220 904 227" stroke-width="1.6" stroke-opacity="0.42"/>
      <path d="M 838 215 Q 825 226 834 237" stroke-width="1.5" stroke-opacity="0.3"/>
      <path d="M 764 217 Q 751 232.5 760 248" stroke-width="1.4" stroke-opacity="0.2"/>
      <path d="M 692 219 Q 679 239 688 259" stroke-width="1.3" stroke-opacity="0.13"/>
    </g>
    <g stroke="#3d8fb8" stroke-linecap="round" stroke-opacity="0.2">
      <path d="M 1004 217 h 82" stroke-width="1.6"/>
      <path d="M 1018 224 h 56" stroke-width="1.2"/>
    </g>
    <rect y="208" width="1200" height="92" fill="#071c2e" opacity="0.22"/>
  </g>

  <rect width="760" height="300" fill="url(#bnr-veil)"/>

  <g transform="translate(72 0)">
    <rect x="0" y="88" width="216.5" height="26" rx="13" fill="none" stroke="#7fd4e8" stroke-opacity="0.5"/>
    <text x="15" y="105.5" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" letter-spacing="1.7" fill="#7fd4e8" fill-opacity="0.92">MEMORY · TIEFENWASSER</text>
    <text x="-2" y="171" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="45" font-weight="600" letter-spacing="-0.6" fill="#eaf3f8">Working Memory Bundle</text>
    <text x="0" y="201" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="0.5" fill="#8fb3c9">ellmos-working-memory-bundle</text>
  </g>

  <rect y="297" width="1200" height="3" fill="#7fd4e8" opacity="0.85"/>
</svg>
